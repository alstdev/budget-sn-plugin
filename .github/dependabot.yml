version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same idea as min-release-age in .npmrc: skip versions younger than 3 days.
    cooldown:
      default-days: 3
    versioning-strategy: increase
    ignore:
      # typescript-eslint 8.x accepts only typescript <6.1 (peer dependency);
      # remove this rule once typescript-eslint supports newer TypeScript.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
