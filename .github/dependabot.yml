version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same idea as min-release-age in .npmrc: skip versions younger than 3 days.
    cooldown:
      default-days: 3
    versioning-strategy: increase
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
