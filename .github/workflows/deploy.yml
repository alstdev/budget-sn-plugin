# Publishes the plugin page to GitHub Pages and creates a tagged release.
# Started manually from main (Actions -> Deploy -> Run workflow). The deploy
# job waits for manual approval in the github-pages environment; only after
# that the release job tags the built commit v<package.json version>
# (docs/SPEC.md 7.6). A version that already has a tag is never republished.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Version must not be published yet
        id: version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists: bump the version in package.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npm run check:workflows
      - run: npm audit --audit-level=high

      - name: Release files (zip + SHA256SUMS)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          (cd dist && zip -r -X -q "../release/budget-hello-$VERSION.zip" .)
          (cd release && sha256sum "budget-hello-$VERSION.zip" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Tag and GitHub release
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create tag and release on the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$TAG" \
            --notes "Built from $SHA. Verify the zip with: sha256sum -c SHA256SUMS"
